name: Scraper Scheduler

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  run-scheduler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run scheduler
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          STARTER_STORY_HANDLE: ${{ secrets.STARTER_STORY_HANDLE }}
          SCRAPER_DEFAULT_MAX_VIDEOS: ${{ secrets.SCRAPER_DEFAULT_MAX_VIDEOS }}
        run: npm run scraper:scheduler
